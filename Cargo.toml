[package]
name = "bitlab"
version = "2.9.16"
edition = "2021"
description = "Self-hosted Stremio streaming hub (Rust port)"
license = "MIT"

[[bin]]
name = "bitlab"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rusqlite = { version = "0.32", features = ["bundled"] }
regex = "1"
rand = "0.9"
hmac = "0.12"
sha1 = "0.10"
sha2 = "0.10"
hex = "0.4"
base32 = "0.4"
base64 = "0.22"
url = "2"
chrono = "0.4"
quick-xml = { version = "0.37", features = ["serialize"] }
walkdir = "2"
qrcode = "0.14"
image = { version = "0.25", default-features = false, features = ["png"] }
mime_guess = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
tokio-util = { version = "0.7", features = ["io"] }
futures = "0.3"
bytes = "1"
subtle = "2"
libc = "0.2"
sysinfo = "0.32"
once_cell = "1"
anyhow = "1"
librqbit-utp = "0.7.0"
socket2 = "0.6"

[profile.release]
lto = "thin"
codegen-units = 1
