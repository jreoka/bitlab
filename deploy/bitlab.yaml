apiVersion: v1
kind: Namespace
metadata:
  name: bitlab
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: bitlab-data
  namespace: bitlab
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: ssd
  resources:
    requests:
      # Rackspace Spot volumes max out at 20Gi, so the cache budget sits below it.
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bitlab
  namespace: bitlab
  labels:
    app: bitlab
spec:
  replicas: 1
  # One writer to the data volume, and the BitTorrent client must not be
  # duplicated (two pods would fragment the cache).
  strategy:
    type: Recreate
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: bitlab
  template:
    metadata:
      labels:
        app: bitlab
    spec:
      # Inbound peers matter on thin swarms: hostNetwork lets the torrent client
      # accept connections on 51413 instead of being outbound-only.
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
      terminationGracePeriodSeconds: 30
      initContainers:
        # Bitlab is a static binary; fetching it from the release keeps the
        # cluster free of a registry dependency and the digest pinned.
        - name: fetch
          image: alpine:3.20
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              wget -qO /work/bitlab "$BINARY_URL"
              echo "$BINARY_SHA  /work/bitlab" | sha256sum -c -
              chmod 0755 /work/bitlab
              /work/bitlab --version 2>/dev/null || true
          env:
            - name: BINARY_URL
              value: https://github.com/jreoka/bitlab/releases/download/v2.9.6/bitlab-linux-amd64
            - name: BINARY_SHA
              value: 5445d4601920d780bcad425d7c69a6011bf1fce065a9132031ce853a6de50dba
          volumeMounts:
            - name: bin
              mountPath: /work
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 200m, memory: 128Mi}
      containers:
        - name: bitlab
          image: alpine:3.20
          command: ["/work/bitlab"]
          env:
            - name: BITLAB_ADDR
              value: ":8090"
            - name: BITLAB_DATA
              value: /data
            - name: BITLAB_BASE_URL
              value: https://stream.dill.moe
            - name: BITLAB_CACHE_GB
              value: "16"
            - name: BITLAB_CACHE_RESERVE_GB
              value: "2"
            - name: BITLAB_CACHE_RETAIN_HOURS
              value: "24"
            - name: BITLAB_CACHE_GRACE_MINUTES
              value: "10"
            - name: BITLAB_IDLE_MINUTES
              value: "20"
            - name: BITLAB_READAHEAD_MB
              value: "64"
            - name: BITLAB_PREBUFFER_MB
              value: "8"
            - name: BITLAB_TORRENT_PORT
              value: "51413"
            - name: BITLAB_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bitlab-secrets
                  key: admin-password
          ports:
            - name: http
              containerPort: 8090
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: "2", memory: 2Gi}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: bin
              mountPath: /work
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: bitlab-data
        - name: bin
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: bitlab
  namespace: bitlab
spec:
  selector:
    app: bitlab
  ports:
    - name: http
      port: 8090
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bitlab
  namespace: bitlab
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    # Streaming must not be buffered or cut off by the proxy.
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
spec:
  ingressClassName: nginx
  tls:
    - hosts: ["stream.dill.moe"]
      secretName: bitlab-tls
  rules:
    - host: stream.dill.moe
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: bitlab
                port:
                  number: 8090
