apiVersion: v1
kind: Namespace
metadata:
  name: bitlab
  labels:
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: bitlab-data
  namespace: bitlab
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: ssd
  resources:
    requests:
      # Rackspace Spot volumes max out at 20Gi, so the cache budget sits below it.
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bitlab
  namespace: bitlab
  labels:
    app: bitlab
spec:
  replicas: 1
  # One writer to the data volume, and the BitTorrent client must not be
  # duplicated (two pods would fragment the cache).
  strategy:
    type: Recreate
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: bitlab
  template:
    metadata:
      labels:
        app: bitlab
    spec:
      # hostNetwork used to expose the app on the node's public IP:8090 over
      # plain HTTP, bypassing TLS and the ingress. The torrent port is published
      # with hostPort instead, so the HTTP listener stays cluster-internal.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      initContainers:
        # Bitlab is a static binary; fetching it from the release keeps the
        # cluster free of a registry dependency and the digest pinned.
        - name: fetch
          image: alpine:3.20@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              wget -qO /work/bitlab "$BINARY_URL"
              echo "$BINARY_SHA  /work/bitlab" | sha256sum -c -
              chmod 0755 /work/bitlab
              /work/bitlab --version 2>/dev/null || true
          env:
            - name: BINARY_URL
              value: https://github.com/jreoka/bitlab/releases/download/v2.10.0/bitlab-linux-amd64
            - name: BINARY_SHA
              value: 69e7bb85ff04c88fc55af2485c5a662681dca5a0e57435229c7a03d7752f66dd
          volumeMounts:
            - name: bin
              mountPath: /work
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 200m, memory: 128Mi}
      containers:
        - name: bitlab
          image: alpine:3.20@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc
          command: ["/work/bitlab"]
          env:
            - name: BITLAB_ADDR
              value: ":8090"
            - name: BITLAB_DATA
              value: /data
            - name: BITLAB_BASE_URL
              value: https://stream.dill.moe
            - name: BITLAB_CACHE_GB
              value: "16"
            - name: BITLAB_CACHE_RESERVE_GB
              value: "2"
            - name: BITLAB_CACHE_RETAIN_HOURS
              value: "24"
            - name: BITLAB_CACHE_GRACE_MINUTES
              value: "10"
            - name: BITLAB_IDLE_MINUTES
              value: "20"
            - name: BITLAB_READAHEAD_MB
              value: "64"
            - name: BITLAB_PREBUFFER_MB
              value: "8"
            - name: BITLAB_TORRENT_PORT
              value: "51413"
            - name: BITLAB_TRUST_PROXY
              value: "1"
            - name: BITLAB_MAX_TORRENTS
              value: "40"
            # The load-time predictor. Probes are random releases from the pool
            # that searches populate, capped at 30 an hour and 120 MB an hour:
            # the loop stops for the rest of the hour at either cap.
            - name: BITLAB_PROBE_ENABLED
              value: "on"
            - name: BITLAB_PROBE_INTERVAL
              value: "60"
            - name: BITLAB_PROBE_PER_HOUR
              value: "30"
            - name: BITLAB_PROBE_MB_HOUR
              value: "120"
            - name: BITLAB_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bitlab-secrets
                  key: admin-password
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8090
            # Both protocols share 51413. Client-side apply merges this list
            # by containerPort and silently drops the second entry, so deploy
            # this manifest with `kubectl replace`, not `kubectl apply`.
            - name: torrent-tcp
              containerPort: 51413
              hostPort: 51413
              protocol: TCP
            - name: torrent-udp
              containerPort: 51413
              hostPort: 51413
              protocol: UDP
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: "2", memory: 2Gi}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: bin
              mountPath: /work
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: bitlab-data
        - name: bin
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: bitlab
  namespace: bitlab
spec:
  selector:
    app: bitlab
  ports:
    - name: http
      port: 8090
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: bitlab-ingress
  namespace: bitlab
spec:
  podSelector:
    matchLabels:
      app: bitlab
  policyTypes: [Ingress]
  ingress:
    # Admin/addon HTTP only from the ingress controller.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8090
    # Torrent peers may arrive from anywhere.
    - ports:
        - protocol: TCP
          port: 51413
        - protocol: UDP
          port: 51413
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bitlab
  namespace: bitlab
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    # Streaming must not be buffered or cut off by the proxy.
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    # Request bodies are admin JSON only; streaming is GET.
    nginx.ingress.kubernetes.io/proxy-body-size: "1m"
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts: ["stream.dill.moe"]
      secretName: bitlab-tls
  rules:
    - host: stream.dill.moe
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: bitlab
                port:
                  number: 8090
