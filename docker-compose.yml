services:
  bitlab:
    build: .
    container_name: bitlab
    restart: always
    ports:
      - "127.0.0.1:8090:8090"
    environment:
      BITLAB_ADMIN_PASSWORD: ${BITLAB_ADMIN_PASSWORD:-}
      BITLAB_BASE_URL: ${BITLAB_BASE_URL:-}
      BITLAB_CACHE_GB: ${BITLAB_CACHE_GB:-40}
      BITLAB_IDLE_MINUTES: ${BITLAB_IDLE_MINUTES:-30}
      BITLAB_WG_CONF: ${BITLAB_WG_CONF:-}
    volumes:
      - ./data:/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
