name: build

on:
  push:
    branches: [main]
  pull_request:

env:
  # Pure Go everywhere: modernc sqlite needs no cgo, and cgo would pull in
  # libutp for uTP. Windows runners have no C compiler anyway.
  CGO_ENABLED: "0"

jobs:
  # Build and test natively on each OS, so a linux-only breakage cannot hide a
  # windows or macos one.
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go test ./...

  # Prove every release target still cross-compiles from one host.
  cross:
    name: cross-compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make dist
